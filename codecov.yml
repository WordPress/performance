codecov:
  notify:
    require_ci_to_pass: yes
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 80%
        base: auto
        branches:
          - trunk
        informational: true
    patch:
      default:
        threshold: 80%
        informational: true
comment:
  hide_project_coverage: TRUE
  layout: "condensed_header, condensed_files, condensed_footer"
