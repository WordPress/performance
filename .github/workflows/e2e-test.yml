name: End-to-End Tests

on:
  push:
    branches:
      - trunk
      - 'release/**'
      - 'add/setup-e2e-tests'
    paths:
      - '.github/workflows/e2e-test.yml'
      - 'plugins/auto-sizes/**'
      - '**/package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '.github/workflows/e2e-test.yml'
      - 'plugins/auto-sizes/**'
      - '**/package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
    types:
      - opened
      - reopened
      - synchronize

jobs:
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Playwright dependencies
        run: npx playwright install chromium --with-deps

      - name: Install WordPress
        run: npm run wp-env start

      - name: Run tests
        run: npm run test-e2e
