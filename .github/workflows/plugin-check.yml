name: Plugin Check

on:
    workflow_dispatch:
    push:
        branches:
            - develop
            - trunk
    pull_request:
        types:
            - opened
            - synchronize
            - ready_for_review

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name for pull requests
    # or the commit hash for any other events.
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: read
        outputs:
            auto-sizes: ${{ steps.filter.outputs.auto-sizes }}
            dominant-color-images: ${{ steps.filter.outputs.dominant-color-images }}
            embed-optimizer: ${{ steps.filter.outputs.embed-optimizer }}
            image-prioritizer: ${{ steps.filter.outputs.image-prioritizer }}
            optimization-detective: ${{ steps.filter.outputs.optimization-detective }}
            performance-lab: ${{ steps.filter.outputs.performance-lab }}
            speculation-rules: ${{ steps.filter.outputs.speculation-rules }}
            view-transitions: ${{ steps.filter.outputs.view-transitions }}
            web-worker-offloading: ${{ steps.filter.outputs.web-worker-offloading }}
            webp-uploads: ${{ steps.filter.outputs.webp-uploads }}
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              id: filter
              with:
                  filters: |
                      auto-sizes:
                        - 'plugins/auto-sizes/**'
                      dominant-color-images:
                        - 'plugins/dominant-color-images/**'
                      embed-optimizer:
                        - 'plugins/embed-optimizer/**'
                      image-prioritizer:
                        - 'plugins/image-prioritizer/**'
                      optimization-detective:
                        - 'plugins/optimization-detective/**'
                      performance-lab:
                        - 'plugins/performance-lab/**'
                      speculation-rules:
                        - 'plugins/speculation-rules/**'
                      view-transitions:
                        - 'plugins/view-transitions/**'
                      web-worker-offloading:
                        - 'plugins/web-worker-offloading/**'
                      webp-uploads:
                        - 'plugins/webp-uploads/**'

    prepare-matrix:
        needs: [detect-changes]
        runs-on: ubuntu-latest
        # Always run this job, even if detect-changes was skipped
        if: always() && (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped')
        permissions:
            contents: read
        outputs:
            plugins: ${{ steps.set-matrix.outputs.plugins }}
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
              with:
                  php-version: '8.3'

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Build plugins
              run: npm run build-plugins

            - name: Upload built plugins
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: built-plugins
                  path: build/
                  retention-days: 1

            - name: Generate matrix
              id: set-matrix
              run: |
                  ALL_PLUGINS=$(jq -c '.plugins' plugins.json)

                  # For non-PR events (push to trunk/develop), run all plugins
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                      echo "plugins=$ALL_PLUGINS" >> $GITHUB_OUTPUT
                      exit 0
                  fi

                  # For PRs, filter to only changed plugins
                  CHANGED_PLUGINS="[]"
                  for plugin in $(echo "$ALL_PLUGINS" | jq -r '.[]'); do
                      # Convert plugin name with hyphens to underscores for output key
                      OUTPUT_KEY=$(echo "$plugin" | tr '-' '_')
                      CHANGED="${{ toJson(needs.detect-changes.outputs) }}"

                      # Check if this plugin has changes
                      if echo "$CHANGED" | jq -e ".[\"$OUTPUT_KEY\"] == \"true\"" > /dev/null; then
                          CHANGED_PLUGINS=$(echo "$CHANGED_PLUGINS" | jq -c --arg p "$plugin" '. + [$p]')
                      fi
                  done

                  # If no plugins changed, output empty array
                  echo "plugins=$CHANGED_PLUGINS" >> $GITHUB_OUTPUT

    plugin-check:
        needs: prepare-matrix
        # Skip if no plugins to check (empty array)
        if: needs.prepare-matrix.outputs.plugins != '[]'
        name: Check ${{ matrix.plugin }}
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                plugin: ${{ fromJson(needs.prepare-matrix.outputs.plugins) }}
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

            - name: Download built plugins
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
              with:
                  name: built-plugins
                  path: build

            - name: Run plugin check
              uses: wordpress/plugin-check-action@27b60e89aad9f3006d5c800a8fa9bbaa87c36421 # main
              with:
                  build-dir: ./build/${{ matrix.plugin }}
                  slug: ${{ matrix.plugin }}
                  ignore-codes: 'readme_reserved_contributors,WordPress.WP.I18n.TextDomainMismatch'
